name: Frontend

# La CI de `normativa-web`. Corre `yarn verificar` —lint, tipos y pruebas— y `yarn build`, y
# nada mas: aqui no se construye imagen ni se despliega.
#
# QUE HAY QUE VERIFICAR, DESDE #50
# La V6 salio entera (su fuente es `c01fe9a`) y en `frontend/` queda la cadena de herramientas de
# `rentas@ac379ac`, version a version, con una raiz vacia. Lo que corre aqui son las barreras:
# las diez prohibiciones de ESLint con sus muestras, que el stack siga siendo el de `rentas`, que
# la V6 no vuelva, y lo que la imagen y el despliegue dan por puesto. Las pantallas llegan con la
# epica #47, y con ellas sus pruebas; este archivo no cambia por eso.
#
# POR QUE SI LLEVA FILTRO `paths`, AL REVES QUE `publicar-imagenes.yml`
# Alli el filtro seria un defecto: la guarda de `infrastructure` necesita que TODO commit de
# `main` tenga sus imagenes, y con filtro un merge de solo documentacion dejaria un `sha`
# de `main` sin imagenes, en silencio. Aqui no se publica nada que nadie vaya a pedir por su
# etiqueta, asi que la equivalencia no hace falta y el filtro solo evita gastar una
# instalacion de yarn en cada cambio del backend o del corpus.
#
# Y el filtro ya no esconde nada del backend: hasta `c01fe9a`, pruebas de la V6 leian Java y
# `docs/50-api/` —exigian que NO hubiera ningun `@PostMapping` ni `formas-de-la-api.json`—, asi
# que un PR de backend podia romperlas sin que esta CI se disparara. Salieron con la V6 (#50), y
# ninguna prueba de `frontend/` lee hoy `backend/` ni `docs/50-api/`. Lo que si queda fuera del
# filtro, y dicho: `imagen-y-despliegue.test.ts` lee `despliegue/compose.yaml`,
# `infrastructure/src/descriptor.ts` y `publicar-imagenes.yml`, asi que un PR que solo toque esos
# tres puede dejarla roja sin que esta CI lo vea. Es anterior a #50 y no se cierra aqui.
#
# El workflow se incluye en su propio filtro: un cambio en este archivo tiene que verificarse
# a si mismo. Sin eso, romper la CI del frontend es el unico cambio que la CI del frontend no
# revisa.
#
# NO NECESITA EL CLON HERMANO, TODAVIA. El backend si —`settings.gradle.kts` consume
# `infrastructure` como *composite build*—. El frontend no declara aun ningun `@kamayuk/*`: los
# cinco de ejecucion entran con #55 y `@kamayuk/verificaciones` con #62, y ese dia este archivo
# gana el checkout de `kamayuk-lib` al lado, como el de `rentas`. Hasta entonces se clona donde
# toca y ya.
#
# QUE SE EJECUTA, Y EN QUE ORDEN
# `yarn verificar` encadena lint, tipos y pruebas —las tres, y en ese orden, porque el error
# mas barato de leer tiene que salir primero—, y es LA MISMA orden que se ejecuta en local: si
# aqui se escribieran los tres pasos por separado, «verde en CI» y «verde en mi maquina»
# dejarian de ser la misma afirmacion en cuanto una de las dos cambiara. `yarn build` viene
# despues porque afirma otra cosa: que `tsc` pase no implica que Rollup empaquete.

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

# Sin permisos de escritura: este trabajo lee y verifica, no publica nada.
permissions:
  contents: read

# Un `push` nuevo cancela la corrida anterior de la misma rama. En `main` no se cancela: cada
# commit de `main` tiene que dejar su propio veredicto, y una corrida cancelada no es uno.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: normativa-web verifica y construye
    runs-on: ubuntu-latest
    # Un colgado no consume cuota sin limite: la leccion de `observabilidad-alertas`.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # La version sale de `frontend/.nvmrc` y no de un literal aqui: con el literal, la CI y
      # quien clona el repositorio son dos numeros que pueden separarse sin que nada lo diga.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # `--frozen-lockfile` y no `yarn install` a secas: sin el, una version nueva de
      # cualquier dependencia entra en la CI sin pasar por ningun PR, y el dia que rompa algo
      # el diff no lo explica.
      - name: Instalar
        run: yarn install --frozen-lockfile

      - name: Lint, tipos y pruebas
        run: yarn verificar

      # Se construye aunque la raiz este vacia: un `tsc` en verde no demuestra que Vite sepa
      # empaquetar esto, y la imagen que publica `main` sale de este mismo `yarn build`.
      - name: Construir el bundle
        run: yarn build
