# ============================================================================
#  NORMATIVA, LEVANTADO CONTRA LA PLATAFORMA (ADR-0031 §4, C-18)
#
#  Solo lo de este sistema: su migrador, su implantacion y su backend. NO trae
#  PostgreSQL ni Keycloak — los usa, y los levanta el compose de la plataforma,
#  que vive en el clon hermano `infrastructure`—, y desde la etapa 4 de ADR-0039
#  tampoco trae a `identidad`, el sistema del que la implantacion lee su copia
#  local de la autorizacion: ese lo levanta SU compose, en la misma red. El
#  `CronJob` del consumidor que el descriptor declara no tiene contraparte aqui,
#  como el ingestor de `rentas`: en el compose la pasada la hace la implantacion.
#
#      docker compose -f ../infrastructure/despliegue/plataforma.compose.yaml up -d --wait
#      docker compose -f despliegue/compose.yaml \
#          --env-file ../infrastructure/despliegue/.env up --build --wait
#
#  EL `--env-file` NO SOBRA, y `env_file:` NO lo sustituye (#74). Este compose interpola
#  cinco `${KAMAYUK_CLAVE_*:?}` que salen del `.env` de la PLATAFORMA, y Compose busca
#  `.env` en el directorio del proyecto —el de este archivo—, donde no hay ninguno.
#  Medido el 2026-09-13: sin `--env-file`, `docker compose config` sale **1** con
#  «required variable KAMAYUK_CLAVE_APP is missing a value»; con el, **0**.
#
#  Y `env_file:` se probo y NO vale: alimenta el entorno del CONTENEDOR, no la
#  interpolacion, asi que el mismo `config` vuelve a salir 1 con el error identico.
#  Un enlace `.env` junto a este archivo si funcionaria —medido, exit 0—, pero `.env`
#  esta en `.gitignore` en los seis repositorios y des-ignorarlo para versionar un
#  enlace es como se acaban subiendo credenciales.
#
#  ESTE ARCHIVO Y EL DESCRIPTOR TIENEN QUE DECIR LO MISMO. Es la trampa que
#  ADR-0011 anoto —«dos formas de levantar el sistema, que se separen, que una
#  variable nueva entre en el cluster y no en el compose»— y con cuatro sistemas
#  se multiplica por cuatro. Lo que lo sujeta es una guarda de `infrastructure`,
#  `infra/verificaciones/compose-de-los-sistemas.test.ts`, que lee este archivo y
#  `infrastructure/src/descriptor.ts` y compara las dos mitades: los nombres de
#  las variables de entorno de cada proceso, la base a la que apunta cada uno, el
#  rol con que se conecta, el prefijo de la ruta y los dos objetivos del
#  Dockerfile. No se copia una lista a mano: se derivan las dos y se comparan.
#
#  Y DESDE #39 TAMBIEN SU INTERFAZ. Hasta aqui este comentario decia «AQUI NO HAY
#  FRONTEND, y no es un olvido»: `frontend/` existia desde F-1 pero era andamiaje
#  sin ninguna pantalla, no habia imagen que levantar y un servicio habria sido un
#  contenedor sirviendo un `<h1>`. Ahora hay cinco secciones, hay
#  `frontend/Dockerfile` y hay puerta de identidad, asi que el servicio entra — y
#  con el, la otra mitad del reparto de la ruta: `/normativa/api/v1` al backend y
#  `/normativa` a la interfaz, dentro del mismo Traefik. Ese reparto es lo que
#  pone la pantalla y la API en el MISMO ORIGEN, que es lo unico que hace que no
#  haga falta la cabecera CORS que este backend no publica.
# ============================================================================

name: kamayuk-normativa

services:
  # ── El migrador, que corre y termina ────────────────────────────────────────
  #
  # La imagen del MIGRADOR, no la de la aplicacion (C-14, punto 1): son dos
  # objetivos del mismo `Dockerfile` y estan separados porque las credenciales de
  # `kamayuk_owner` —el unico rol con DDL— existen durante la migracion y desaparecen
  # con ella. Meterlas en la imagen de la aplicacion le daria DDL sobre el padron
  # a un proceso de larga vida expuesto en HTTP (ARQ-03 §4).
  #
  # Lee `KAMAYUK_DB_OWNER_USUARIO` y `KAMAYUK_DB_OWNER_CLAVE`, y NO `KAMAYUK_DB_USUARIO`:
  # lo dice el `main` de `kamayuk.normativa.esquema.Migrador`, que rechaza
  # argumentos a proposito para que una clave no quede en el historial del proceso.
  normativa-migraciones:
    build:
      # El contexto es la RAIZ del repositorio, no `backend/`: el `.dockerignore`
      # que lo acota vive alli y desde `backend/` no se aplica.
      context: ..
      dockerfile: backend/Dockerfile
      target: migrador
    image: kamayuk-normativa-migrador:compose
    environment:
      # `base` es el servicio del compose de la plataforma, no `postgres`. En el
      # cluster es otro nombre y lo entrega el entorno (C-17, punto 1): el
      # descriptor pide `e.plataforma.motor` en vez de escribirlo. Lo que si es de
      # este sistema —y por eso coincide en los dos— es el nombre de SU base.
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/normativa
      KAMAYUK_DB_OWNER_USUARIO: kamayuk_owner
      KAMAYUK_DB_OWNER_CLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER, sale del .env de la plataforma}
    # Corre y termina. Si se reinicia vuelve a comprobar el ambiente y no aplica
    # nada: el migrador es idempotente y tiene su prueba que lo demuestra.
    restart: "no"

  # ── La implantacion: la fila de `municipalidad` en SU base ───────────────────
  #
  # La MISMA imagen que la aplicacion con el perfil `batch` (ADR-0003: un
  # artefacto, dos perfiles), asi que no abre ningun puerto y termina al acabar.
  #
  # En el cluster el migrador va de `initContainer` de este Job, porque un
  # `Deployment` no sabe esperar a un `Job` y Kubernetes no tiene `dependsOn`.
  # Aqui `depends_on: service_completed_successfully` es exactamente esa espera, y
  # por eso el orden se expresa como dependencia y no repitiendo el migrador.
  normativa-implantacion:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    image: kamayuk-normativa:compose
    depends_on:
      normativa-migraciones:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: batch
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/normativa
      # `kamayuk_app` y solo `kamayuk_app`: sin DDL, sin BYPASSRLS, sin DELETE y
      # propietario de nada.
      KAMAYUK_DB_USUARIO: kamayuk_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP, sale del .env de la plataforma}
      # El prefijo es `kamayuk.implantacion`, y desde R-A/B lo es en los cuatro. Hasta
      # entonces `rentas` leia `sgtm.implantacion` —era el monolito— y la asimetria dejo
      # SU Job de implantacion saliendo con codigo 0 sin implantar nada (C-18 §5). Lo que
      # impide ahora apuntar esta implantacion con las variables de otro no es que el
      # nombre difiera, sino la guarda que compara cada descriptor con SU Java.
      KAMAYUK_IMPLANTACION_UBIGEO: ${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      KAMAYUK_IMPLANTACION_NOMBRE: ${KAMAYUK_MUNICIPALIDAD:?falta KAMAYUK_MUNICIPALIDAD en el .env de la plataforma}
      KAMAYUK_IMPLANTACION_TIPO: ${KAMAYUK_TIPO_DE_MUNICIPALIDAD:-DISTRITAL}
      # La cuenta TIENE que ser la misma que el usuario de Keycloak: es lo unico
      # que une la fila de `usuario` con la identidad del token (ADR-0005).
      KAMAYUK_IMPLANTACION_ADMINISTRADOR: ${KAMAYUK_ADMINISTRADOR:?falta KAMAYUK_ADMINISTRADOR (ver identidad/datos-de-implantacion.sh)}
      KAMAYUK_IMPLANTACION_NOMBREDELADMINISTRADOR: ${KAMAYUK_NOMBRE_DEL_ADMINISTRADOR:-Administrador del sistema}
      # Por omision `true`, al reves que en el codigo: aqui se levanta una marcha
      # blanca, y mientras D-02a siga abierta toda cifra sale de parametros que
      # nadie ha firmado. Solo se aplica al ALTA.
      KAMAYUK_IMPLANTACION_ESDEMOSTRACION: ${KAMAYUK_ES_DEMOSTRACION:-true}
      KAMAYUK_IMPLANTACION_URL: jdbc:postgresql://base:5432/normativa
      # OWNERCLAVE sin guion bajo: en una variable de entorno el `_` se traduce a
      # punto, asi que `KAMAYUK_IMPLANTACION_OWNER_CLAVE` seria
      # `kamayuk.implantacion.owner.clave` y no `owner-clave`.
      KAMAYUK_IMPLANTACION_OWNERCLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER, sale del .env de la plataforma}
      # ── El consumidor del buzon de `identidad` (ADR-0039, etapa 4) ──────────
      #
      # La implantacion termina con una pasada del consumidor, para que la
      # municipalidad recien implantada traiga lo que `identidad` ya publico.
      # Son las MISMAS seis variables que el `CronJob` del descriptor le da a
      # su consumidor, y las lee `ConfiguracionDelConsumidorDeIdentidad`.
      #
      # `identidad-sistema` y NO `identidad`: en la red `kamayuk-plataforma` el
      # alias `identidad` lo tiene Keycloak, y el backend del sistema se llama
      # `identidad-sistema` a proposito (la cabecera de SU compose lo mide).
      KAMAYUK_IDENTIDAD_URL: http://identidad-sistema:8080
      # A donde se pide el token, por la red interna: Keycloak, que aqui si se
      # llama `identidad`. Es una direccion, no una identidad.
      KAMAYUK_IDENTIDAD_TOKEN: http://identidad:8080/realms/kamayuk/protocol/openid-connect/token
      # Un cliente por municipalidad: la cuenta de servicio es la que lleva
      # `municipalidad_id` (ADR-0028 §2), e `identidad` deriva QUIEN pregunta del
      # `azp` del token y nunca de un parametro.
      KAMAYUK_IDENTIDAD_CLIENTE: kamayuk-normativa-servicio-${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      # La clave de ese cliente confidencial, que crea `reconciliar-identidades.sh
      # servicios` en el Keycloak de la plataforma. VACIA POR OMISION, y a
      # proposito: lo que NO hace es inventar una cadena que ningun emisor firmo
      # (#21). Sin ella la peticion sale sin credencial e `identidad` contesta
      # 401 — y desde la etapa 5 de ADR-0039 eso ya no es un aviso: la
      # implantacion FALLA. El administrador dejo de sembrarse aqui, asi que sin
      # credencial la copia local se queda sin una sola cuenta y la municipalidad
      # queda implantada sin nadie que pueda entrar. Hay que levantar `identidad`
      # PRIMERO y poner esta clave.
      KAMAYUK_IDENTIDAD_CREDENCIAL: ${KAMAYUK_CREDENCIAL_NORMATIVA_IDENTIDAD:-}
      # A quien se avisa cuando un evento no se puede aplicar nunca y se aparta.
      KAMAYUK_IDENTIDAD_CONSUMIDOR_RESPONSABLE: ${KAMAYUK_RESPONSABLE:-Quien levanto este compose}
      KAMAYUK_IDENTIDAD_CONSUMIDOR_CANAL: ${KAMAYUK_CANAL_DE_AVISOS:-http://localhost:8025/api/v1/send}
    restart: "no"

  # ── El backend ──────────────────────────────────────────────────────────────
  #
  # EL SERVICIO SE LLAMA COMO EL SISTEMA, y no `aplicacion`. No es estilo: los
  # cuatro composes comparten la red `kamayuk-plataforma`, y Compose le da a cada
  # servicio un alias de red con su nombre — cuatro servicios llamados
  # `aplicacion` dejarian ese alias resolviendo a uno cualquiera de los cuatro.
  # Ademas es el nombre que la propia aplicacion da por hecho: el valor por
  # omision de `kamayuk.caja.origenes` es `http://rentas:8080/rentas/api/v1`.
  normativa:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    image: kamayuk-normativa:compose
    depends_on:
      normativa-implantacion:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: web
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/normativa
      KAMAYUK_DB_USUARIO: kamayuk_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP, sale del .env de la plataforma}
      # Sin el emisor la aplicacion se NIEGA a arrancar, y es deliberado: un
      # backend que atiende sin poder validar un token responde a la sonda, se
      # declara sano y no atiende a nadie (ADR-0005).
      #
      # Es el MISMO realm que los otros tres: un login para los cuatro
      # (ADR-0030 §3).
      KAMAYUK_OIDC_EMISOR: ${KAMAYUK_OIDC_EMISOR:-http://localhost:8180}/realms/kamayuk
      # El emisor es una identidad, no una direccion de red. El navegador llega a
      # Keycloak por su nombre publico y este contenedor por el interno de la red
      # del compose; usar el publico para las dos cosas haria que el backend
      # buscara el JWKS en si mismo y todo token seria invalido por un motivo que
      # no se parece a su causa.
      KAMAYUK_OIDC_JWKS: http://identidad:8080/realms/kamayuk/protocol/openid-connect/certs
    labels:
      # Su prefijo, y SOLO el suyo. Reclamar el de otro no falla: se lo queda, y
      # las peticiones dejan de llegar a su dueno. Es la misma prohibicion (a) que
      # `descriptor/auditoria.ts` aplica en el cluster.
      #
      # DESDE #39 RECLAMA `/normativa/api/v1` Y NO `/normativa` ENTERO, porque la
      # otra mitad la sirve la interfaz. Y la PRIORIDAD va escrita y no heredada
      # de la longitud de la regla: Traefik v3 ordena por longitud del `match`
      # cuando nadie declara `priority`, asi que hoy saldria bien **por
      # accidente** — y al reves el fallo no grita. Con la precedencia invertida,
      # `/normativa/api/v1/conjuntos` lo contestaria el nginx de la interfaz, cuyo
      # `try_files $$uri /index.html` devuelve el `index.html` con un **200**: la
      # pantalla pide JSON y recibe HTML con codigo de exito. No un error, una
      # pagina.
      #
      # SIN `middlewares`: `Api.RAIZ` del backend es `/normativa/api/v1` entera,
      # asi que quitarle el prefijo dejaria a Spring buscando `/api/v1/...` y
      # contestando 404 a todo.
      - traefik.enable=true
      - traefik.http.routers.normativa.rule=PathPrefix(`/normativa/api/v1`)
      - traefik.http.routers.normativa.priority=20
      - traefik.http.services.normativa.loadbalancer.server.port=8080
    healthcheck:
      # `/actuator/health` y no `/actuator/health/liveness`: aqui esta sonda
      # alimenta `depends_on: service_healthy`, o sea «esta listo para atender», y
      # el grupo entero incluye el indicador de la base. En el cluster son tres
      # sondas distintas y la de VIDA es la del grupo `liveness` a proposito
      # (C-17, punto 2): matar el proceso no devuelve la base.
      #
      # Las tres rutas —esta y las dos del descriptor— tienen que estar entre las
      # que `SeguridadWeb` permite sin token, y eso lo comprueba
      # `sondas-contra-la-cadena` leyendo el Java. Con la cadena anterior a C-17
      # esto contestaba 401 y `curl --fail` dejaba el contenedor `unhealthy` para
      # siempre, con la aplicacion sana.
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s

  # ── La interfaz (#39) ───────────────────────────────────────────────────────
  #
  # `kamayuk-normativa-interfaz` y NUNCA `kamayuk-normativa-web`: ese nombre ya es
  # el del BACKEND con el perfil `web` de Spring en el descriptor, y darselo aqui
  # dejaria dos artefactos del producto llamados igual.
  #
  # POR QUE SE LLAMA `normativa-interfaz` Y NO `interfaz`
  #
  # Por lo mismo que el backend se llama `normativa` y no `aplicacion`, escrito
  # unas lineas mas arriba: los composes de los cinco comparten la red
  # `kamayuk-plataforma` y Compose le da a cada servicio un alias de red con su
  # nombre. ADR-0030 §1 dice que habra varias interfaces, y `rentas` y `caja` ya
  # tienen la suya: un alias `interfaz` resolveria a una cualquiera de las tres. El
  # sintoma de eso no es un error: es una peticion que a veces llega a quien no era.
  #
  # SIN `depends_on`, Y ESO ES UNA AFIRMACION
  #
  # Esta interfaz no necesita el backend para dibujarse, y tampoco para hablar con
  # el: `frontend/nginx.conf` NO reenvia a ningun sitio. Quien pone la pantalla y
  # la API en el mismo origen —que es lo unico que hace falta, porque el backend no
  # publica ni una cabecera CORS— es Traefik, con las dos reglas de aqui.
  #
  # Declarar una dependencia que no existe costaria dos cosas: haria que el compose
  # MINTIERA sobre el grafo —que es justo lo que la guarda de `infrastructure`
  # compara contra el descriptor— y obligaria a `up -d normativa-interfaz` a
  # levantar antes la base, el migrador y la implantacion para servir unos archivos
  # que no los usan.
  #
  # Lo unico que SI necesita de fuera es la red `kamayuk-plataforma`, porque este
  # archivo entero la declara `external: true`.
  normativa-interfaz:
    build:
      # El contexto es `frontend/` y no la raiz, al reves que los tres de arriba:
      # este `Dockerfile` no tiene ni un `COPY` que salga de ahi, y el
      # `.dockerignore` que acota el contexto —`frontend/.dockerignore`— solo se
      # aplica desde la raiz del contexto. El de la raiz excluye `frontend/`
      # entero, asi que no dice nada de esta imagen.
      context: ../frontend
      target: interfaz
    image: kamayuk-normativa-interfaz:compose
    # EL PUERTO LLEVA EL SUFIJO DEL SISTEMA, y no es capricho.
    #
    # `KAMAYUK_PUERTO_INTERFAZ` a secas YA LO USA la interfaz del monolito
    # —`infrastructure/despliegue/compose.yaml` publica
    # `${KAMAYUK_PUERTO_INTERFAZ:-8081}:8080`— y el `.env` es EL MISMO para todo
    # esto. Reusar el nombre tendria dos efectos, los dos malos: con ese `.env`
    # delante el valor por omision de aqui NO SE APLICARIA NUNCA, asi que
    # documentar un puerto seria documentar algo falso; y las dos interfaces
    # pedirian el mismo puerto del anfitrion y se pelearian por el. Es lo que
    # `caja`#39 midio.
    #
    # 8085 porque 8080 es el ingreso del monolito, 8081 su interfaz por omision,
    # 8082 la de `caja` y 8083 la de `rentas` — y porque en la instalacion donde
    # esto se midio el `.env` desplaza los puertos y deja `KAMAYUK_PUERTO_INTERFAZ`
    # en 8084. Comprobado libre antes de escribirlo.
    #
    # PARA QUE SIRVE, existiendo Traefik: para mirar el nginx SIN el ingreso
    # delante. Por aqui las rutas llegan con el prefijo puesto, o sea que
    # `/normativa/...` cae en el bloque que contesta 404 diciendo que falta el
    # `stripprefix` — que es exactamente lo que se quiere poder distinguir cuando
    # algo no llega.
    ports:
      - "${KAMAYUK_PUERTO_INTERFAZ_NORMATIVA:-8085}:8080"
    labels:
      # La otra mitad del reparto. Prioridad MENOR que la de la API, escrita y no
      # heredada de la longitud de la regla: ver la nota del servicio `normativa`.
      #
      # Y aqui SI se quita el prefijo, porque este nginx sirve en la raiz de su
      # contenedor. Que el paquete lo pida con el prefijo puesto lo garantiza
      # `vite.config.ts` con `base: '/normativa/'` (ADR-0030 §2).
      - traefik.enable=true
      - traefik.http.routers.normativa-interfaz.rule=PathPrefix(`/normativa`)
      - traefik.http.routers.normativa-interfaz.priority=10
      - traefik.http.routers.normativa-interfaz.middlewares=normativa-quitar-prefijo
      - traefik.http.middlewares.normativa-quitar-prefijo.stripprefix.prefixes=/normativa
      - traefik.http.services.normativa-interfaz.loadbalancer.server.port=8080
    # SIN `healthcheck` aqui, y tampoco es un olvido: `frontend/Dockerfile` ya
    # declara el suyo —`wget --spider -q http://127.0.0.1:8080/index.html`, por
    # 127.0.0.1 y no `localhost` porque este nginx escucha solo en IPv4— y Docker
    # aplica el `HEALTHCHECK` de la imagen al contenedor, que es de donde
    # `up --wait` lee la salud. Copiarlo aqui seria un segundo sitio con la misma
    # verdad, y el que envejece sin ponerse rojo.

# La red de la plataforma, QUE YA EXISTE. `external: true` es lo que impide que
# este compose cree una segunda con el mismo nombre y deje a los servicios sin
# verse: el sintoma seria «Connection refused» a `base`, que se lee como que el
# motor no esta levantado.
networks:
  default:
    name: kamayuk-plataforma
    external: true
